<mat-card class="form-container">
  <h2>➕ Add New Partner</h2>
  <form [formGroup]="partnerForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Alias</mat-label>
      <input matInput formControlName="alias" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <input matInput formControlName="type" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Direction</mat-label>
      <mat-select formControlName="direction">
        <mat-option *ngFor="let dir of directionValues" [value]="dir">{{ dir }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Flow Type</mat-label>
      <mat-select formControlName="processedFlowType">
        <mat-option *ngFor="let type of flowTypeValues" [value]="type">{{ type }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Create</button>
  </form>
</mat-card>
