<mat-card>
  <h2>Partner List</h2>
  <table mat-table [dataSource]="partners" class="mat-elevation-z8 full-width">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let partner">{{ partner.id }}</td>
    </ng-container>

    <!-- Alias Column -->
    <ng-container matColumnDef="alias">
      <th mat-header-cell *matHeaderCellDef>Alias</th>
      <td mat-cell *matCellDef="let partner">{{ partner.alias }}</td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let partner">
        <button mat-icon-button color="warn" (click)="deletePartner(partner.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'alias', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'alias', 'actions'];"></tr>
  </table>
</mat-card>
